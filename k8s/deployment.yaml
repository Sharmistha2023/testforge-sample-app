# SEEDED: no securityContext, no resource limits, no probes, privileged, latest tag
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels: { app: task-tracker }
  template:
    metadata:
      labels: { app: task-tracker }
    spec:
      containers:
        - name: api
          image: task-tracker:latest
          ports:
            - containerPort: 3000
          securityContext:
            privileged: true
          env:
            - name: JWT_SECRET
              value: super-secret-jwt-key-123456
---
apiVersion: v1
kind: Service
metadata:
  name: task-tracker
spec:
  type: NodePort
  selector: { app: task-tracker }
  ports:
    - port: 80
      targetPort: 3000
---
# SEEDED: overly broad RBAC
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: task-tracker-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
